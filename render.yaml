services:
  - type: web
    name: smartdownloads-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./SmartDownloads.Server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEVICE_TOKEN_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GLOBAL_DAILY_AI_LIMIT
        value: "1000"
      - key: DEVICE_DAILY_AI_LIMIT
        value: "500"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smartdownloads-quota
          property: connectionString
  - type: keyvalue
    name: smartdownloads-quota
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
