name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SmartDownloads.slnx
      - run: dotnet build SmartDownloads.slnx -c Release --no-restore
      - run: dotnet run --project SmartDownloads.SmokeTests -c Release --no-build
      - run: dotnet list SmartDownloads.slnx package --vulnerable --include-transitive
