name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - shell: pwsh
        run: ./scripts/build-release.ps1 -ServerUrl "https://smartdownloads-api.onrender.com"
      - shell: pwsh
        run: (Get-FileHash artifacts/SmartDownloads-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  SmartDownloads-win-x64.zip" | Set-Content artifacts/SmartDownloads-win-x64.zip.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/SmartDownloads-win-x64.zip artifacts/SmartDownloads-win-x64.zip.sha256 --title "Smart Downloads ${{ github.ref_name }}" --generate-notes
