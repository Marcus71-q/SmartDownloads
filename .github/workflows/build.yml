name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SmartDownloads.slnx
      - run: dotnet build SmartDownloads.slnx -c Release --no-restore
      - run: dotnet run --project SmartDownloads.SmokeTests -c Release --no-build
      - run: dotnet list SmartDownloads.slnx package --vulnerable --include-transitive
